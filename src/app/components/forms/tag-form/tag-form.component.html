<div class="tag-form-container">
  <h2 class="form-title">{{ isEditMode ? 'Modifier le tag' : 'Créer un nouveau tag' }}</h2>
  <form [formGroup]="tagForm" (ngSubmit)="onSubmit()" class="tag-form">
    <mat-form-field appearance="outline">
      <mat-label>Label</mat-label>
      <input matInput formControlName="label" placeholder="Nom du tag">
      <mat-error *ngIf="tagForm.get('label')?.hasError('required')">Le label est requis</mat-error>
    </mat-form-field>

    <div class="color-emoji-section">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Couleur</mat-label>
        <input matInput [ngxMatColorPicker]="picker" formControlName="color">
        <ngx-mat-color-toggle [for]="picker"></ngx-mat-color-toggle>
        <ngx-mat-color-picker #picker></ngx-mat-color-picker>
      </mat-form-field>
      <emoji-picker #emojiPicker style="width: 100%; max-height: 300px;"></emoji-picker>
    </div>

    <div class="form-actions">
      <button mat-stroked-button color="primary" type="button" (click)="onCancel()">Annuler</button>
      <button mat-raised-button color="accent" type="submit">{{ isEditMode ? 'Mettre à jour' : 'Créer' }}</button>
      <button *ngIf="isEditMode" mat-icon-button color="warn" (click)="deleteTag()" matTooltip="Supprimer">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </form>
</div>
